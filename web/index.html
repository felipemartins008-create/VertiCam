<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>VertiCam - Vertical Jump Analysis</title>
  <meta name="description" content="Piattaforma di analisi biomeccanica del salto verticale, misurazione del tempo di volo e autoregolazione neuromuscolare dell'allenamento." />
  <meta name="theme-color" content="#080C14" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body, #root {
      width: 100%;
      height: 100%;
      background-color: #080C14;
      overflow: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* Scrollbar scura e rifinita */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #080C14;
    }
    ::-webkit-scrollbar-thumb {
      background: #1E293B;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00E5FF;
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
